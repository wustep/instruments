<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0e0d0b" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Not Found · Instruments</title>
    <!-- What the host serves, with status 404, for an address that is none of the app's (vercel.json's
         rewrites name every one that is). A page of its own: no app, no sound, the app's type and colours. -->
    <link rel="stylesheet" href="/src/not-found.css" />
  </head>
  <body>
    <main class="nf">
      <!-- a part that does not play: the readout's two lines -->
      <h1 class="nf-word">Tacet</h1>
      <p class="nf-line"><span class="nf-lamp" aria-hidden="true"></span>404 · <span id="nf-path">nothing</span> plays at this address</p>
      <nav class="nf-places" aria-label="The instruments">
        <span class="nf-fam"><a href="/piano">piano</a></span>
        <span class="nf-fam"><a href="/violin">violin</a><a href="/viola">viola</a><a href="/cello">cello</a><a href="/bass">bass</a><a href="/harp">harp</a></span>
        <span class="nf-fam"><a href="/flute">flute</a><a href="/oboe">oboe</a><a href="/clarinet">clarinet</a><a href="/bassoon">bassoon</a></span>
        <span class="nf-fam"><a href="/horn">horn</a><a href="/trumpet">trumpet</a><a href="/trombone">trombone</a><a href="/tuba">tuba</a></span>
        <span class="nf-fam"><a href="/timpani">timpani</a></span>
        <span class="nf-fam"><a href="/orchestra">orchestra</a><a href="/symphony">symphony</a></span>
      </nav>
      <nav class="nf-pages" aria-label="Pages"><a href="/measurements">measurements</a><a href="/notes">notes</a></nav>
    </main>
    <script>
      // the address asked for, as it was typed (shortened; text only)
      (function () {
        var p = decodeURIComponent(location.pathname).replace(/\/+$/, '');
        if (p && p !== '/404.html') document.getElementById('nf-path').textContent = 'no ' + (p.length > 28 ? p.slice(1, 27) + '…' : p.slice(1));
      })();
    </script>
  </body>
</html>
